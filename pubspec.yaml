name: chat_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.16+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^4.3.0
  cloud_firestore: ^6.1.1
  firebase_auth: ^6.1.3
  firebase_messaging: ^16.1.0
  provider: ^6.0.5
  shared_preferences: ^2.2.0
  http: ^1.1.0
  intl: ^0.20.2
  csv: ^5.0.0
  pdf: ^3.11.3
  printing: ^5.14.2
  share_plus: ^12.0.1
  scroll_to_index: ^3.0.1
  image_picker: ^1.1.2
  file_picker: ^8.1.4
  cloudinary_public: ^0.23.1
  record: ^6.1.2
  audioplayers: ^6.5.1
  path_provider: ^2.1.5
  package_info_plus: ^9.0.0
  onesignal_flutter: ^5.3.5
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21
  # Ajuste para ícone adaptativo: O fundo será branco e o logo centralizado
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo_launcher.png"

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/logo_launcher.png
    - assets/alerta.mp3
    - shorebird.yaml